<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIMPL3 8UTTONS ALPHA 1.0</title>
    <style>
        /* TEMA DE LA INTERFAZ (se cambia en vivo desde el botón 🎨 Tema) */
        :root {
            --ui-bg: #0d0d0d;       /* fondo general */
            --ui-panel: #1e1e1e;    /* menús, modales y botones flotantes */
            --ui-btn: #121212;      /* fondo de los botones de la botonera */
            --ui-text: #ffffff;     /* texto */
            --ui-accent: #3498db;   /* acento: navegación y botones de menú */
        }

        body {
            background-color: var(--ui-bg);
            color: var(--ui-text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        /* Estilo base para ambos botones flotantes */
		
		#fab, #fab-linktree {
		position: fixed;
		right: 20px;
		width: 50px;
		height: 50px;
		border-radius: 50%;
		background-color: color-mix(in srgb, var(--ui-panel) 82%, var(--ui-text));
		color: var(--ui-text);
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 22px;
		cursor: pointer;
		box-shadow: 0 4px 10px rgba(0,0,0,0.3);
		z-index: 1000;
		transition: transform 0.2s, background-color 0.2s;
		
}

		#fab:hover, #fab-linktree:hover {
		transform: scale(1.1);
		background-color: color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text));
}

	/* El engranaje va abajo */
	
		#fab {
		bottom: 20px;
}

	/* El corazón va ubicado justo arriba del engranaje (20px de base + 50px de alto + 12px de separación) */

	#fab-linktree {
    bottom: 82px;
}
        
        #fab.active, #fab:active { opacity: 1; background: color-mix(in srgb, var(--ui-panel) 95%, transparent); }

        #controls {
            position: fixed;
            bottom: 70px;
            right: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            background: color-mix(in srgb, var(--ui-panel) 95%, transparent);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid color-mix(in srgb, var(--ui-panel) 75%, var(--ui-text));
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 999;
            backdrop-filter: blur(5px);
        }
        
        #controls.show { display: flex; }

        .menu-btn {
            background: color-mix(in srgb, var(--ui-accent) 45%, var(--ui-panel));
            color: var(--ui-text);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }

        .menu-btn.active-mode {
            background: #d35400;
            border: 2px solid #e67e22;
        }

        /* GRILLA FIJA 6 COLUMNAS x 4 FILAS (23 BOTONES, POSICIÓN 24 LIBRE) */
        #deck {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 98vw;
            height: 96vh;
            padding: 10px;
            box-sizing: border-box;
        }

        /* ESTILO BASE DE BOTÓN */
        .btn {
            background-color: var(--ui-btn);
            border: 2px solid color-mix(in srgb, var(--ui-btn) 80%, var(--ui-text));
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            font-size: clamp(11px, 1.8vw, 14px);
            white-space: pre-line;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.2s, box-shadow 0.2s;
            padding: 6px;
            box-sizing: border-box;
            position: relative;
            user-select: none;
            touch-action: none;
            overflow: hidden;
        }

        /* ESTILO TIPO PHOTOSHOP (NEÓN INTERIOR) PARA BOTONES ACTIVOS */
        .btn:not(.empty):not(.btn-nav) {
            background-color: var(--ui-btn);
            border: 2px solid var(--btn-color, #00d8ff);
            box-shadow: inset 0 0 14px var(--btn-color, #00d8ff),
                        inset 0 0 3px var(--btn-color, #00d8ff);
            color: var(--ui-text);
        }

        .btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* CASILLEROS VACÍOS */
        .btn.empty {
            background: color-mix(in srgb, var(--ui-text) 2%, transparent);
            border: 1px dashed color-mix(in srgb, var(--ui-bg) 80%, var(--ui-text));
            box-shadow: none;
        }

        /* MODO EDICIÓN */
        body.edit-mode .btn:not(.btn-nav) {
            border-style: dashed !important;
        }
        body.edit-mode .btn.empty {
            border: 1px dashed #555;
            background: rgba(230, 126, 34, 0.05);
        }

        /* BOTONES DE NAVEGACIÓN (PÁGINAS) */
        .btn-nav {
            background: color-mix(in srgb, var(--ui-btn) 92%, var(--ui-text)) !important;
            border: 1px solid color-mix(in srgb, var(--ui-btn) 75%, var(--ui-text)) !important;
            color: var(--ui-accent);
            box-shadow: none !important;
        }

        /* INDICADORES LED OBS */
        .led {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid #222;
            margin-bottom: 6px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .led-on {
            background: radial-gradient(circle at 35% 35%, #7bfb7b, #10b981, #047857);
            box-shadow: 0 0 8px #10b981;
        }
        .led-off {
            background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444, #991b1b);
            box-shadow: 0 0 6px #ef4444;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal {
            background: var(--ui-panel); color: var(--ui-text); padding: 20px; border-radius: 12px; width: 85%; max-width: 350px;
            border: 1px solid color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text)); display: flex; flex-direction: column; gap: 12px;
        }
        .modal h3 { margin: 0; text-align: center; font-size: 18px; }
        .modal label { font-size: 13px; font-weight: bold; color: color-mix(in srgb, var(--ui-text) 65%, var(--ui-panel)); }
        .modal input, .modal select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text));
            background: color-mix(in srgb, var(--ui-panel) 88%, var(--ui-text)); color: var(--ui-text); box-sizing: border-box; font-size: 15px;
        }

        /* PANEL DE TEMA */
        .theme-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .theme-row label { flex: 1; }
        .theme-row input[type="color"] { width: 70px; flex: none; }
        .theme-presets { display: flex; flex-wrap: wrap; gap: 8px; }
        .theme-preset {
            flex: 1 1 auto; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: bold;
            cursor: pointer; border: 2px solid transparent; min-width: 80px; text-align: center;
        }
        .theme-preset:hover { border-color: var(--ui-accent); }

        #themePanel, #obsPanel {
            position: fixed; bottom: 70px; right: 15px; width: 270px; display: none;
            flex-direction: column; gap: 10px; padding: 15px; border-radius: 15px; z-index: 1500;
            background: color-mix(in srgb, var(--ui-panel) 96%, transparent); color: var(--ui-text);
            border: 2px solid color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text));
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            max-height: calc(100vh - 90px); overflow-y: auto;
        }
        #themePanel.show, #obsPanel.show { display: flex; }
        #themePanel h3, #obsPanel h3 { margin: 0; text-align: center; font-size: 16px; }
        #themePanel label, #obsPanel label { font-size: 13px; font-weight: bold; color: color-mix(in srgb, var(--ui-text) 65%, var(--ui-panel)); }
        #obsPanel input {
            width: 100%; padding: 9px; border-radius: 6px; box-sizing: border-box; font-size: 14px; margin-top: 4px;
            border: 1px solid color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text));
            background: color-mix(in srgb, var(--ui-panel) 88%, var(--ui-text)); color: var(--ui-text);
        }
        #obsPanel small { display: block; font-size: 11px; line-height: 1.35; color: color-mix(in srgb, var(--ui-text) 55%, var(--ui-panel)); }
        #obsPanel .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #obsPanel .modal-btns { margin-top: 4px; }
        .obs-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
        .obs-status .led { margin: 0; flex: none; }
        .obs-pass-wrap { position: relative; }
        .obs-pass-wrap input { padding-right: 38px; }
        .obs-pass-wrap button {
            position: absolute; right: 4px; top: 8px; width: 32px; height: 30px; border: none; border-radius: 6px;
            background: transparent; color: var(--ui-text); cursor: pointer; font-size: 15px;
        }
        #themePanel input[type="color"] { height: 34px; padding: 2px; cursor: pointer; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ui-panel) 70%, var(--ui-text)); background: transparent; }
        #themePanel .modal-btns { margin-top: 4px; }
        #themePanel .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal input[type="color"] { height: 40px; padding: 2px; cursor: pointer; }
        .modal-btns { display: flex; gap: 8px; margin-top: 10px; }
        .modal-btns button {
            flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .btn-cancel { background: #444; color: white; }
        .btn-save { background: #10b981; color: white; }
        .btn-delete { background: #b33939; color: white; }
    </style>
</head>
<body>
    
	<div id="fab-linktree" title="Apoyar el proyecto">❤️</div>
    <div id="fab">⚙️</div>

    <div id="controls">
        <button class="menu-btn" id="btnToggleEdit" onclick="toggleEditMode()">✏️ Modo Edición: OFF</button>
        <button class="menu-btn" onclick="openFolderModal()">📁 Nueva Carpeta</button>
        <button class="menu-btn" onclick="openButtonModal()">🔲 Nuevo Botón</button>
        <button class="menu-btn" onclick="toggleThemePanel()">🎨 Tema / Colores</button>
        <button class="menu-btn" onclick="toggleObsPanel()">🎥 Conexión OBS</button>
    </div>

    <!-- Panel de conexión con OBS: la clave se aplica y reconecta al instante -->
    <div id="obsPanel">
        <h3>🎥 Conexión con OBS</h3>
        <div class="obs-status"><span class="led led-off" id="obsLed"></span><span id="obsStatusText">Comprobando…</span></div>
        <div>
            <label for="obsIp">IP</label>
            <input type="text" id="obsIp" placeholder="127.0.0.1" autocomplete="off">
        </div>
        <div>
            <label for="obsPort">Puerto</label>
            <input type="number" id="obsPort" placeholder="4455" min="1" max="65535">
        </div>
        <div>
            <label for="obsPassword">Clave del servidor WebSocket</label>
            <div class="obs-pass-wrap">
                <input type="password" id="obsPassword" placeholder="Pegá la clave de OBS" autocomplete="off" spellcheck="false">
                <button type="button" id="obsPassToggle" title="Mostrar / ocultar" onclick="toggleObsPasswordVisibility()">👁</button>
            </div>
            <small id="obsPassHint"></small>
        </div>
        <small>En OBS: Herramientas → Ajustes del Servidor WebSocket → Mostrar información de conexión → Copiar contraseña.</small>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="toggleObsPanel(false)">Cerrar</button>
            <button class="btn-save" id="obsSaveBtn" onclick="saveObsConfig()">Guardar y conectar</button>
        </div>
    </div>

    <!-- Panel de Tema (sin fondo oscuro para ver los cambios en vivo) -->
    <div id="themePanel">
        <h3>🎨 Colores de la interfaz</h3>
        <div class="theme-row"><label for="themeBg">Fondo</label><input type="color" id="themeBg" data-var="--ui-bg"></div>
        <div class="theme-row"><label for="themePanelColor">Menús y paneles</label><input type="color" id="themePanelColor" data-var="--ui-panel"></div>
        <div class="theme-row"><label for="themeBtn">Fondo de botones</label><input type="color" id="themeBtn" data-var="--ui-btn"></div>
        <div class="theme-row"><label for="themeText">Texto</label><input type="color" id="themeText" data-var="--ui-text"></div>
        <div class="theme-row"><label for="themeAccent">Acento</label><input type="color" id="themeAccent" data-var="--ui-accent"></div>
        <label>Temas rápidos</label>
        <div class="theme-presets" id="themePresets"></div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="resetTheme()">Restaurar</button>
            <button class="btn-save" onclick="toggleThemePanel(false)">Listo</button>
        </div>
    </div>

    <div id="deck"></div>

    <!-- Modal Nueva Carpeta -->
    <div class="modal-overlay" id="modalFolderOverlay">
        <div class="modal">
            <h3>Crear Carpeta</h3>
            <div>
                <label>Nombre de la carpeta</label>
                <input type="text" id="folderName" placeholder="Ej: Mis Sonidos">
            </div>
            <div>
                <label>Color Neón</label>
                <input type="color" id="folderColor" value="#3498db">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-save" onclick="saveFolder()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Botón -->
    <div class="modal-overlay" id="modalButtonOverlay">
        <div class="modal">
            <h3>Crear Botón</h3>
            <div>
                <label>Texto del Botón</label>
                <input type="text" id="btnText" placeholder="Ej: Clip Replay">
            </div>
            <div>
                <label>Color Neón</label>
                <input type="color" id="btnColor" value="#00d8ff">
            </div>
            <div>
                <label>Acción</label>
                <select id="btnType" onchange="toggleActionFields()">
                    <option value="atajo">Atajo de Teclado</option>
                    <option value="programa">Abrir Programa/Archivo</option>
                    <option value="obs">Control de OBS</option>
                </select>
            </div>

            <!-- Grupo de Comando (Se oculta si elige OBS) -->
            <div id="commandGroup">
                <label>Comando (Ej: ^c para Ctrl+C)</label>
                <input type="text" id="btnCommand" placeholder="^c, {F1}, start notepad...">
            </div>

            <!-- Opciones específicas de OBS -->
            <div id="obsFields" style="display: none;">
                <label>Acción de OBS</label>
                <select id="btnAction" onchange="toggleObsFields()">
                    <option value="save_replay">🎬 Guardar Clip</option>
                    <option value="toggle_mic">🎤 Silenciar / Desmutear Micrófono</option>
                    <option value="toggle_desktop">🔊 Silenciar / Desmutear Audio PC</option>
                    <option value="toggle_scene">🎬 Cambiar de Escena</option>
                    <option value="toggle_stream">📡 Iniciar / Detener Stream</option>
                    <option value="toggle_record">🔴 Iniciar / Detener Grabación</option>
                </select>
            </div>

            <!-- Botones (Siempre visibles) -->
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-save" onclick="saveButton()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Editar Botón / Carpeta -->
    <div class="modal-overlay" id="modalEditOverlay">
        <div class="modal">
            <h3 id="editModalTitle">Editar Elemento</h3>
            <input type="hidden" id="editBtnId">
            <div>
                <label>Texto</label>
                <input type="text" id="editBtnText" placeholder="Texto del botón">
            </div>
            <div>
                <label>Color Neón</label>
                <input type="color" id="editBtnColor" value="#00d8ff">
            </div>
            <div id="editActionFields">
                <label id="editCommandLabel">Comando / Atajo / Ruta</label>
                <input type="text" id="editBtnCommand" placeholder="Comando o ruta">
                
                <div id="editClipDurationGroup" style="display: none; margin-top: 10px;">
                    <label>Duración del Clip (segundos)</label>
                    <input type="number" id="editBtnClipDuration" value="60" min="1">
                </div>
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-delete" onclick="deleteCurrentButton()">Eliminar</button>
                <button class="btn-save" onclick="saveEditedButton()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        let allDecks = {};
        let currentFolder = 'main';
        let currentPage = 0;
        let isEditMode = false;
        let targetSlotIndex = null;
        let obsPollInterval = null;

        // Variables Drag & Drop y Doble Tap
        let draggedGlobalIndex = null;
        let touchGhost = null;
        let lastTouchTime = 0;
        let lastTouchSlot = null;

        const fab = document.getElementById('fab');
        const controls = document.getElementById('controls');

        fab.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            controls.classList.toggle('show');
            fab.classList.toggle('active');
        });

        document.body.addEventListener('pointerdown', (e) => {
            if (!controls.contains(e.target) && e.target !== fab && !e.target.closest('.modal')) {
                controls.classList.remove('show');
                fab.classList.remove('active');
            }
        });

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btnToggleEdit');
            if (isEditMode) {
                btn.innerText = '✏️ Modo Edición: ON';
                btn.classList.add('active-mode');
                document.body.classList.add('edit-mode');
            } else {
                btn.innerText = '✏️ Modo Edición: OFF';
                btn.classList.remove('active-mode');
                document.body.classList.remove('edit-mode');
            }
            renderDeck(currentFolder, currentPage);
        }

        function ensureDeckSlots(folder) {
            if (!allDecks[folder]) allDecks[folder] = [];
            const minSize = (currentPage + 1) * 23;
            while (allDecks[folder].length < minSize) {
                allDecks[folder].push({ id: 'empty_' + Date.now() + '_' + Math.random(), type: 'empty' });
            }
        }

        async function fetchOBSStatus() {
            try {
                const res = await fetch('/api/obs-status');
                const data = await res.json();
                if (!data.connected) return;

                const updateBtn = (id, isMuted, textMuted, textOn) => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        const led = btn.querySelector('.led');
                        const text = btn.querySelector('.btn-label');
                        if (led && text) {
                            led.className = isMuted ? 'led led-off' : 'led led-on';
                            text.innerText = isMuted ? textMuted : textOn;
                        }
                    }
                }

                updateBtn('btn_obs_mic', data.micMuted, "Micrófono:\nDesactivado", "Micrófono:\nActivado");
                updateBtn('btn_obs_desktop', data.desktopMuted, "Audio PC:\nDesactivado", "Audio PC:\nActivado");

                const sceneBtn = document.getElementById('btn_obs_scene');
                if (sceneBtn) {
                    const text = sceneBtn.querySelector('.btn-label');
                    if (text) text.innerText = `🎬 Escena Activa:\n${data.currentScene}`;
                }
            } catch (err) {}
        }

function renderDeck(folderName, page = 0) {
    currentFolder = folderName;
    currentPage = page;
    ensureDeckSlots(currentFolder);

    const deckEl = document.getElementById('deck');
    deckEl.innerHTML = '';
    
    if (obsPollInterval) {
        clearInterval(obsPollInterval);
        obsPollInterval = null;
    }

    const pageStartIndex = currentPage * 23;

    for (let slot = 0; slot < 23; slot++) {
        const globalIndex = pageStartIndex + slot;
        const el = document.createElement('div');
        el.className = 'btn';
        el.dataset.globalIndex = globalIndex;

        // Navegación Página Siguiente
        if (slot === 22) {
            el.classList.add('btn-nav');
            el.innerText = `➡️ Pág. ${currentPage + 2}`;
            el.addEventListener('pointerdown', () => renderDeck(currentFolder, currentPage + 1));
            deckEl.appendChild(el);
            continue;
        }

        // Navegación Página Anterior
        if (slot === 21 && currentPage > 0) {
            el.classList.add('btn-nav');
            el.innerText = `⬅️ Pág. ${currentPage}`;
            el.addEventListener('pointerdown', () => renderDeck(currentFolder, currentPage - 1));
            deckEl.appendChild(el);
            continue;
        }

        const btnData = allDecks[currentFolder]?.[globalIndex] || { type: 'empty' };

        if (!btnData || btnData.type === 'empty') {
            el.classList.add('empty');
        } else {
            el.id = btnData.id;
            
            // Color de borde neón
            if (btnData.color) {
                el.style.setProperty('--btn-color', btnData.color);
            } else {
                el.style.setProperty('--btn-color', '#00d8ff');
            }

            // Crear luz LED para todos los botones de tipo OBS (sin importar la carpeta)
            if (btnData.type === 'obs') {
                const led = document.createElement('div');
                led.className = 'led led-off';
                el.appendChild(led);
            }

            // Crear etiqueta de texto
            const label = document.createElement('span');
            label.className = 'btn-label';
            
            // Marcar etiqueta para actualización de escena
            if (btnData.action === 'toggle_scene' || btnData.id === 'btn_obs_scene') {
                label.classList.add('scene-label');
            }
            
            label.innerText = btnData.text || '';
            el.appendChild(label);
        }

        // Ejecución al hacer clic
        el.addEventListener('pointerdown', async (e) => {
            if (isEditMode) return;

            if (btnData.type === 'folder') {
                renderDeck(btnData.target, 0);
            } else if (btnData.type !== 'empty') {
                await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(btnData)
                });
                if (btnData.type === 'obs') {
                    setTimeout(fetchOBSStatus, 150);
                }
            }
        });

        // Doble clic para editar
        el.addEventListener('dblclick', () => {
            if (!isEditMode) return;
            triggerConfigureModal(globalIndex, btnData);
        });

        if (isEditMode) {
            attachDragAndTouchEvents(el, globalIndex, btnData);
        }

        deckEl.appendChild(el);
    }

    // Activar polling si hay algún botón de OBS visible en pantalla
    const hasObsButtons = allDecks[currentFolder]?.some(btn => btn && btn.type === 'obs');
    if (hasObsButtons || currentFolder === 'obs') {
        fetchOBSStatus();
        obsPollInterval = setInterval(fetchOBSStatus, 800);
    }
}

async function fetchOBSStatus() {
    try {
        const response = await fetch('/api/obs/status');
        const data = await response.json();

        if (!data.connected) return;

        const { micMuted, desktopMuted, currentScene } = data.state;

        // 1. Actualizar texto de la escena activa
        if (currentScene) {
            document.querySelectorAll('.scene-label').forEach(label => {
                label.innerText = `Escena Activa: ${currentScene}`;
            });
        }

        // 2. Actualizar estado de las luces LED
        document.querySelectorAll('.btn').forEach(el => {
            const globalIdx = el.dataset.globalIndex;
            if (globalIdx === undefined) return;

            const btnData = allDecks[currentFolder]?.[globalIdx];
            if (!btnData || btnData.type !== 'obs') return;

            const led = el.querySelector('.led');
            if (!led) return;

            // Escena activa
            if (btnData.action === 'toggle_scene' || btnData.id === 'btn_obs_scene') {
                led.className = 'led led-on';
                return;
            }

            const action = (btnData.action || '').toLowerCase();
            const text = (btnData.text || '').toLowerCase();

            // Botón de Micrófono: Verde si micMuted es false / Rojo si es true
            if (action === 'toggle_mic' || action === 'mute_mic' || text.includes('mic')) {
                led.className = micMuted ? 'led led-off' : 'led led-on';
            } 
            // Botón de Audio de Escritorio: Verde si desktopMuted es false / Rojo si es true
            else if (action === 'toggle_desktop' || action === 'mute_desktop' || text.includes('escritorio') || text.includes('audio')) {
                led.className = desktopMuted ? 'led led-off' : 'led led-on';
            }
        });
    } catch (err) {
        console.error("Error al consultar estado de OBS:", err);
    }
}

        function triggerConfigureModal(globalIndex, btnData) {
            targetSlotIndex = globalIndex;
            if (!btnData || btnData.type === 'empty') {
                openButtonModal();
            } else if (!btnData.id.startsWith('back_')) {
                openEditModal(btnData);
            } else {
                alert("El botón de regresar no se puede editar.");
            }
        }

        // SISTEMA DE ARRASTRE Y DOBLE TAP TÁCTIL
        function attachDragAndTouchEvents(el, globalIndex, btnData) {
            // Arrastre con Mouse
            el.draggable = true;
            el.addEventListener('dragstart', (e) => {
                if (!isEditMode) return;
                draggedGlobalIndex = globalIndex;
                e.dataTransfer.setData('text/plain', globalIndex);
                el.style.opacity = '0.4';
            });
            el.addEventListener('dragend', () => { el.style.opacity = '1'; draggedGlobalIndex = null; });
            el.addEventListener('dragover', (e) => e.preventDefault());
            el.addEventListener('drop', (e) => {
                e.preventDefault();
                const sourceIdx = parseInt(e.dataTransfer.getData('text/plain'));
                if (!isNaN(sourceIdx) && sourceIdx !== globalIndex) {
                    swapButtons(sourceIdx, globalIndex);
                }
            });

            // Arrastre y Doble Tap Táctil
            let touchStartPos = { x: 0, y: 0 };
            let touchMoved = false;

            el.addEventListener('touchstart', (e) => {
                if (!isEditMode) return;
                const touch = e.touches[0];
                touchStartPos = { x: touch.clientX, y: touch.clientY };
                touchMoved = false;
                draggedGlobalIndex = globalIndex;

                touchGhost = el.cloneNode(true);
                touchGhost.style.position = 'fixed';
                touchGhost.style.pointerEvents = 'none';
                touchGhost.style.opacity = '0.8';
                touchGhost.style.zIndex = '3000';
                touchGhost.style.width = el.offsetWidth + 'px';
                touchGhost.style.height = el.offsetHeight + 'px';
                touchGhost.style.left = (touch.clientX - el.offsetWidth / 2) + 'px';
                touchGhost.style.top = (touch.clientY - el.offsetHeight / 2) + 'px';
                document.body.appendChild(touchGhost);

                el.style.opacity = '0.3';
            }, { passive: false });

            el.addEventListener('touchmove', (e) => {
                if (draggedGlobalIndex === null || !touchGhost) return;
                const touch = e.touches[0];
                const dist = Math.hypot(touch.clientX - touchStartPos.x, touch.clientY - touchStartPos.y);
                
                if (dist > 10) touchMoved = true;

                if (touchMoved) {
                    e.preventDefault();
                    touchGhost.style.left = (touch.clientX - touchGhost.offsetWidth / 2) + 'px';
                    touchGhost.style.top = (touch.clientY - touchGhost.offsetHeight / 2) + 'px';
                }
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                if (!isEditMode) return;

                if (touchGhost) {
                    touchGhost.remove();
                    touchGhost = null;
                }
                el.style.opacity = '1';

                const now = Date.now();
                const timeDiff = now - lastTouchTime;

                // DETECCIÓN DE DOBLE TAP
                if (!touchMoved && lastTouchSlot === globalIndex && timeDiff < 350 && timeDiff > 0) {
                    draggedGlobalIndex = null;
                    lastTouchTime = 0;
                    lastTouchSlot = null;
                    triggerConfigureModal(globalIndex, btnData);
                    return;
                }

                lastTouchTime = now;
                lastTouchSlot = globalIndex;

                // INTERCAMBIAR BOTONES AL SOLTAR ARRASTRE TÁCTIL
                if (touchMoved && draggedGlobalIndex !== null) {
                    const touch = e.changedTouches[0];
                    const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (targetEl) {
                        const btnEl = targetEl.closest('.btn');
                        if (btnEl && btnEl.dataset.globalIndex !== undefined) {
                            const targetIdx = parseInt(btnEl.dataset.globalIndex);
                            if (!isNaN(targetIdx) && targetIdx !== draggedGlobalIndex) {
                                swapButtons(draggedGlobalIndex, targetIdx);
                            }
                        }
                    }
                }

                draggedGlobalIndex = null;
            });
        }

        async function swapButtons(fromIndex, toIndex) {
            ensureDeckSlots(currentFolder);
            const temp = allDecks[currentFolder][fromIndex];
            allDecks[currentFolder][fromIndex] = allDecks[currentFolder][toIndex];
            allDecks[currentFolder][toIndex] = temp;

            await fetch('/api/save-deck', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folderId: currentFolder, buttons: allDecks[currentFolder] })
            });

            renderDeck(currentFolder, currentPage);
        }

        async function loadData() {
            const response = await fetch('/api/buttons');
            allDecks = await response.json();
            renderDeck(currentFolder, currentPage);
        }
        
// MODALES
        function openFolderModal() {
            document.getElementById('modalFolderOverlay').style.display = 'flex';
            controls.classList.remove('show');
            fab.classList.remove('active');
        }

        function openButtonModal() {
            document.getElementById('modalButtonOverlay').style.display = 'flex';
            controls.classList.remove('show');
            fab.classList.remove('active');
            toggleActionFields();
        }

        function openEditModal(btn) {
            document.getElementById('editBtnId').value = btn.id;
            document.getElementById('editBtnText').value = btn.text || '';
            document.getElementById('editBtnColor').value = btn.color || '#00d8ff';

            const actionFields = document.getElementById('editActionFields');
            const editCmdInput = document.getElementById('editBtnCommand');
            const editCmdLabel = document.getElementById('editCommandLabel');

            if (btn.type === 'folder') {
                actionFields.style.display = 'none';
                document.getElementById('editModalTitle').innerText = 'Editar Carpeta';
            } else {
                actionFields.style.display = 'block';
                document.getElementById('editModalTitle').innerText = 'Editar Botón';

                if (btn.type === 'obs') {
                    editCmdInput.style.display = 'none';
                    if (editCmdLabel) editCmdLabel.style.display = 'none';
                } else {
                    editCmdInput.style.display = 'block';
                    if (editCmdLabel) editCmdLabel.style.display = 'block';
                    editCmdInput.value = btn.keys || btn.command || '';
                }
            }

            document.getElementById('modalEditOverlay').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('modalFolderOverlay').style.display = 'none';
            document.getElementById('modalButtonOverlay').style.display = 'none';
            document.getElementById('modalEditOverlay').style.display = 'none';
            
            document.getElementById('folderName').value = '';
            document.getElementById('btnText').value = '';
            document.getElementById('btnCommand').value = '';
            targetSlotIndex = null;
        }

        // GUARDAR Y EDITAR
        async function saveFolder() {
            const name = document.getElementById('folderName').value;
            const color = document.getElementById('folderColor').value;
            if (!name) return alert("Escribe un nombre");

            const folderId = 'custom_' + Date.now();
            
            await fetch('/api/add-folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ parentFolder: currentFolder, folderId: folderId, text: name, color: color, targetIndex: targetSlotIndex })
            });

            closeModals();
            loadData();
        }

        async function saveButton() {
            const text = document.getElementById('btnText').value;
            const color = document.getElementById('btnColor').value;
            const type = document.getElementById('btnType').value;
            const command = document.getElementById('btnCommand').value;

            // Validación del texto
            if (!text) return alert("Por favor escribe el texto del botón");

            const newBtn = {
                id: 'btn_' + Date.now(),
                text: text,
                color: color,
                type: type,
            };

            // Lógica según el tipo de botón seleccionado
            if (type === 'obs') {
                const action = document.getElementById('btnAction').value;
                if (!action) return alert("Selecciona una acción de OBS");
                newBtn.action = action;
            } else if (type === 'atajo') {
                if (!command) return alert("Completa el campo de atajo");
                newBtn.keys = command;
            } else {
                if (!command) return alert("Completa el comando o ruta");
                newBtn.command = command;
            }

            await fetch('/api/add-button', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folderId: currentFolder, button: newBtn, targetIndex: targetSlotIndex })
            });

            closeModals();
            loadData();
        }

        async function saveEditedButton() {
            const id = document.getElementById('editBtnId').value;
            const text = document.getElementById('editBtnText').value;
            const color = document.getElementById('editBtnColor').value;
            const command = document.getElementById('editBtnCommand').value;

            const existingBtn = allDecks[currentFolder].find(b => b && b.id === id);
            if (!existingBtn) return;

            const updatedBtn = { ...existingBtn, text, color };
            if (existingBtn.type === 'atajo') updatedBtn.keys = command;
            if (existingBtn.type === 'programa') updatedBtn.command = command;

            await fetch('/api/update-button', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folderId: currentFolder, button: updatedBtn })
            });

            closeModals();
            loadData();
        }

        async function deleteCurrentButton() {
            const id = document.getElementById('editBtnId').value;
            if (confirm("¿Estás seguro de que deseas eliminar este elemento?")) {
                await fetch('/api/delete-button', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folderId: currentFolder, buttonId: id })
                });

                closeModals();
                loadData();
            }
        }

        // ===== TEMA DE LA INTERFAZ (cambio de colores en tiempo real) =====
        const THEME_KEY = 'simpl3_theme';
        const DEFAULT_THEME = { '--ui-bg': '#0d0d0d', '--ui-panel': '#1e1e1e', '--ui-btn': '#121212', '--ui-text': '#ffffff', '--ui-accent': '#3498db' };
        const THEME_PRESETS = {
            'Oscuro':   DEFAULT_THEME,
            'Medianoche': { '--ui-bg': '#0a0e1a', '--ui-panel': '#141c33', '--ui-btn': '#0e1426', '--ui-text': '#e6ecff', '--ui-accent': '#5b8cff' },
            'Bosque':   { '--ui-bg': '#0b140f', '--ui-panel': '#16261b', '--ui-btn': '#0f1c14', '--ui-text': '#e8fff0', '--ui-accent': '#2ecc71' },
            'Violeta':  { '--ui-bg': '#120a1c', '--ui-panel': '#22143a', '--ui-btn': '#190f2b', '--ui-text': '#f3e8ff', '--ui-accent': '#b66dff' },
            'Rojo':     { '--ui-bg': '#160909', '--ui-panel': '#2a1111', '--ui-btn': '#1d0c0c', '--ui-text': '#ffecec', '--ui-accent': '#ff5252' },
            'Claro':    { '--ui-bg': '#e9ecf1', '--ui-panel': '#ffffff', '--ui-btn': '#f6f7fa', '--ui-text': '#1b1f27', '--ui-accent': '#2563eb' }
        };

        function loadTheme() {
            try { return { ...DEFAULT_THEME, ...JSON.parse(localStorage.getItem(THEME_KEY) || '{}') }; }
            catch (e) { return { ...DEFAULT_THEME }; }
        }

        function applyTheme(theme, save = true) {
            for (const [name, value] of Object.entries(theme)) {
                document.documentElement.style.setProperty(name, value);
            }
            document.querySelectorAll('#themePanel input[type="color"]').forEach(inp => {
                if (theme[inp.dataset.var]) inp.value = theme[inp.dataset.var];
            });
            if (save) {
                try { localStorage.setItem(THEME_KEY, JSON.stringify(theme)); } catch (e) {}
            }
        }

        function toggleThemePanel(force) {
            const panel = document.getElementById('themePanel');
            const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
            panel.classList.toggle('show', show);
            if (show) toggleObsPanel(false);
            controls.classList.remove('show');
            fab.classList.remove('active');
        }

        // ===== CONEXIÓN CON OBS (clave en tiempo real) =====
        let obsPanelTimer = null;

        function setObsStatus(connected, error) {
            document.getElementById('obsLed').className = 'led ' + (connected ? 'led-on' : 'led-off');
            document.getElementById('obsStatusText').innerText = connected ? 'Conectado a OBS' : ('Desconectado' + (error ? ' — ' + error : ''));
        }

        async function refreshObsConfig(fillFields) {
            try {
                const res = await fetch('/api/obs/config');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const cfg = await res.json();
                setObsStatus(cfg.connected, cfg.error);
                if (fillFields) {
                    document.getElementById('obsIp').value = cfg.ip || '';
                    document.getElementById('obsPort').value = cfg.port || '';
                    document.getElementById('obsPassword').value = '';
                    document.getElementById('obsPassword').placeholder = cfg.hasPassword ? '•••••• (vacío = conservar)' : 'Pegá la clave de OBS';
                    document.getElementById('obsPassHint').innerText = cfg.hasPassword ? 'Hay una clave guardada.' : 'Todavía no cargaste ninguna clave.';
                }
            } catch (e) {
                document.getElementById('obsLed').className = 'led led-off';
                document.getElementById('obsStatusText').innerText = 'Solo se puede configurar desde la PC donde corre la app';
            }
        }

        function toggleObsPanel(force) {
            const panel = document.getElementById('obsPanel');
            const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
            panel.classList.toggle('show', show);
            clearInterval(obsPanelTimer);
            obsPanelTimer = null;
            if (show) {
                toggleThemePanel(false);
                refreshObsConfig(true);
                // Mientras el panel está abierto, el estado se actualiza solo
                obsPanelTimer = setInterval(() => refreshObsConfig(false), 2500);
            }
            controls.classList.remove('show');
            fab.classList.remove('active');
        }

        function toggleObsPasswordVisibility() {
            const inp = document.getElementById('obsPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        async function saveObsConfig() {
            const btn = document.getElementById('obsSaveBtn');
            const body = {
                ip: document.getElementById('obsIp').value,
                port: document.getElementById('obsPort').value
            };
            const pass = document.getElementById('obsPassword').value;
            if (pass !== '') body.password = pass;   // vacío = conservar la clave actual

            btn.disabled = true;
            btn.innerText = 'Conectando…';
            try {
                const res = await fetch('/api/obs/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    setObsStatus(false, data.error || ('Error ' + res.status));
                } else {
                    setObsStatus(data.connected, data.error);
                    if (data.connected) {
                        document.getElementById('obsPassword').value = '';
                        document.getElementById('obsPassHint').innerText = 'Hay una clave guardada.';
                        fetchOBSStatus();
                    }
                }
            } catch (e) {
                setObsStatus(false, 'No se pudo contactar con la app');
            }
            btn.disabled = false;
            btn.innerText = 'Guardar y conectar';
        }

        document.getElementById('obsPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveObsConfig();
        });

        function resetTheme() { applyTheme({ ...DEFAULT_THEME }); }

        (function initTheme() {
            // Selectores de color: cada movimiento actualiza la interfaz al instante
            document.querySelectorAll('#themePanel input[type="color"]').forEach(inp => {
                inp.addEventListener('input', () => {
                    applyTheme({ ...loadTheme(), [inp.dataset.var]: inp.value });
                });
            });
            // Temas rápidos
            const presetsEl = document.getElementById('themePresets');
            for (const [name, theme] of Object.entries(THEME_PRESETS)) {
                const b = document.createElement('div');
                b.className = 'theme-preset';
                b.innerText = name;
                b.style.background = theme['--ui-panel'];
                b.style.color = theme['--ui-text'];
                b.style.borderColor = theme['--ui-accent'];
                b.addEventListener('click', () => applyTheme({ ...theme }));
                presetsEl.appendChild(b);
            }
            applyTheme(loadTheme(), false);
        })();

        // Inicio
        loadData();
        
        // Muestra u oculta los campos del formulario según si la opción elegida es de OBS o de Atajo/Programa
        function toggleActionFields() {
            const btnType = document.getElementById('btnType').value;
            const obsFields = document.getElementById('obsFields');
            const commandGroup = document.getElementById('commandGroup');

            if (btnType === 'obs') {
                if (obsFields) obsFields.style.display = 'block';
                if (commandGroup) commandGroup.style.display = 'none';
            } else {
                if (obsFields) obsFields.style.display = 'none';
                if (commandGroup) commandGroup.style.display = 'block';
            }
			
        }

// Función para bloquear y auto-completar el nombre si es una Escena de OBS
function handleSceneTextLock() {
    const btnType = document.getElementById('btnType').value;
    const btnAction = document.getElementById('btnAction').value;
    const btnTextInput = document.getElementById('btnText');
    const commandInput = document.getElementById('btnCommand');

    if (btnType === 'obs' && btnAction === 'toggle_scene') {
        const sceneName = commandInput ? commandInput.value || 'X' : 'X';
        btnTextInput.value = `Escena Activa: ${sceneName}`;
        btnTextInput.disabled = true; // Deshabilita el campo para que no se pueda editar
    } else {
        btnTextInput.disabled = false; // Lo vuelve a habilitar si eligen otra opción
    }
}

// Función que ejecuta el desplegable de OBS (onchange del HTML)
function toggleObsFields() {
    handleSceneTextLock();
}

// Escuchar lo que escribe el usuario en el campo del comando/escena para actualizar el nombre al instante
document.addEventListener('DOMContentLoaded', () => {
    const commandInput = document.getElementById('btnCommand');
    if (commandInput) {
        commandInput.addEventListener('input', handleSceneTextLock);
    }
});
